{% macro oppo_mark(size=32, radius=8) %}
<svg class="oppo-mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OPPO">
  <rect width="100" height="100" rx="{{ radius }}" fill="#101112"/>
  <path d="M30 30 L52 50 L30 70" stroke="#4fbd8b" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 30 L48 50 L70 70" stroke="#4fbd8b" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{% endmacro %}
