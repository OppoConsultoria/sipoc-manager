{% extends "base.html" %}
{% block title %}Entrar — SIPOC Manager{% endblock %}
{% block content %}
<div class="auth-wrapper" style="margin: -1.5rem -12px;">
  <div class="card auth-card shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-diagram-3" style="font-size: 2.5rem; color: var(--navy);"></i>
        <h3 class="mt-2 mb-0">SIPOC Manager</h3>
        <p class="text-muted small">Entre com sua conta</p>
      </div>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-navy w-100">Entrar</button>
      </form>
      <p class="text-center mt-3 mb-0 small">
        Ainda não tem conta? <a href="{{ url_for('auth.register') }}">Criar conta</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
